    <!-- Script para limpar dados corrompidos -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme !== null) {
            JSON.parse(theme);
          }
        } catch (e) {
          console.warn('Tema corrompido, resetando...');
          localStorage.removeItem('theme');
        }
        
        try {
          const lang = localStorage.getItem('language');
          if (lang !== null && lang !== 'pt' && lang !== 'en') {
            localStorage.removeItem('language');
          }
        } catch (e) {
          console.warn('Idioma corrompido, resetando...');
          localStorage.removeItem('language');
        }
      })();
    </script>
