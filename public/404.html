<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando...</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, sans-serif;
      flex-direction: column;
      gap: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #1e293b;
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #06b6d4;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <script>
    // Redireciona mantendo o caminho para o React Router processar
    const segment = window.location.pathname.slice(1);
    window.location.replace(
      window.location.origin + '/portfolio/?/' + segment
    );
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>Redirecionando...</p>
  <p><a href="/portfolio/">Clique aqui se não for redirecionado</a></p>
</body>
</html>
